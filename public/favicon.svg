<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="peelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background circle with subtle shadow -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Outer concentric sticker guideline -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="14 10" opacity="0.45" />

  <!-- Inner white sticker disc -->
  <circle cx="256" cy="256" r="150" fill="#ffffff" />

  <!-- Stylized label graphic inside sticker -->
  <!-- Header bar inside sticker -->
  <rect x="166" y="166" width="180" height="24" rx="12" fill="#4f46e5" />
  <!-- Text lines inside sticker -->
  <rect x="180" y="210" width="152" height="18" rx="9" fill="#94a3b8" />
  <rect x="196" y="242" width="120" height="14" rx="7" fill="#cbd5e1" />
  <rect x="216" y="270" width="80" height="12" rx="6" fill="#e2e8f0" />

  <!-- 30mm diameter badge -->
  <g transform="translate(256, 335)">
    <rect x="-48" y="-16" width="96" height="32" rx="16" fill="#4f46e5" />
    <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Ø 30mm</text>
  </g>

  <!-- Folded sticker peel corner top right -->
  <path d="M 380 132 C 370 180 340 210 292 220 C 330 180 350 150 380 132 Z" fill="#000000" opacity="0.12" />
  <path d="M 380 132 C 340 145 315 170 302 210 C 345 200 370 170 380 132 Z" fill="url(#peelGrad)" />
</svg>
